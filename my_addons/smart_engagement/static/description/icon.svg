<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <!-- Modern gradient background -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="brainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- Background circle with modern gradient -->
    <circle cx="64" cy="64" r="58" fill="url(#bgGradient)" stroke="#5a67d8" stroke-width="2" />
    
    <!-- Smart brain/intelligence symbol (center-left) -->
    <g transform="translate(25, 35)">
        <!-- Brain outline -->
        <path d="M5 15 Q5 8 12 8 Q18 8 20 12 Q22 8 28 8 Q35 8 35 15 Q35 20 32 25 Q35 30 32 35 Q28 40 20 40 Q12 40 8 35 Q5 30 8 25 Q5 20 5 15 Z" 
              fill="url(#brainGradient)" stroke="#ffffff" stroke-width="1.5"/>
        <!-- Brain details -->
        <path d="M12 12 Q16 15 20 12 M20 18 Q24 21 28 18 M12 24 Q16 27 20 24 M20 30 Q24 33 28 30" 
              stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <!-- Smart indicator dot -->
        <circle cx="20" cy="20" r="2" fill="#ffffff"/>
    </g>
    
    <!-- Multi-channel engagement symbols (right side) -->
    <g transform="translate(75, 25)">
        <!-- WhatsApp chat bubble -->
        <rect x="0" y="0" width="20" height="14" rx="7" fill="#ffffff" opacity="0.9"/>
        <circle cx="6" cy="7" r="1.5" fill="url(#accentGradient)"/>
        <circle cx="10" cy="7" r="1.5" fill="url(#accentGradient)"/>
        <circle cx="14" cy="7" r="1.5" fill="url(#accentGradient)"/>
        
        <!-- Email symbol -->
        <rect x="0" y="20" width="20" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
        <path d="M2 22 L10 28 L18 22" stroke="url(#accentGradient)" stroke-width="1.5" fill="none"/>
        
        <!-- Mobile/SMS symbol -->
        <rect x="5" y="38" width="10" height="16" rx="2" fill="#ffffff" opacity="0.9"/>
        <rect x="7" y="41" width="6" height="8" rx="1" fill="url(#accentGradient)"/>
        <circle cx="10" cy="51" r="1" fill="url(#accentGradient)"/>
    </g>
    
    <!-- Connection network (smart engagement connections) -->
    <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8">
        <!-- Central hub connections -->
        <line x1="50" y1="55" x2="75" y2="35"/>
        <line x1="50" y1="55" x2="85" y2="48"/>
        <line x1="50" y1="55" x2="85" y2="65"/>
        
        <!-- Network nodes -->
        <circle cx="50" cy="55" r="3" fill="#ffffff"/>
        <circle cx="75" cy="35" r="2" fill="url(#accentGradient)"/>
        <circle cx="85" cy="48" r="2" fill="url(#accentGradient)"/>
        <circle cx="85" cy="65" r="2" fill="url(#accentGradient)"/>
    </g>
    
    <!-- Analytics/Intelligence indicators (bottom) -->
    <g transform="translate(35, 80)">
        <!-- Chart bars representing analytics -->
        <rect x="0" y="12" width="4" height="8" fill="#ffffff" opacity="0.9"/>
        <rect x="6" y="8" width="4" height="12" fill="#ffffff" opacity="0.9"/>
        <rect x="12" y="6" width="4" height="14" fill="#ffffff" opacity="0.9"/>
        <rect x="18" y="10" width="4" height="10" fill="#ffffff" opacity="0.9"/>
        <rect x="24" y="4" width="4" height="16" fill="#ffffff" opacity="0.9"/>
        
        <!-- Trend line -->
        <path d="M2 16 L8 12 L14 10 L20 14 L26 8" stroke="url(#accentGradient)" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Engagement pulse rings -->
    <g transform="translate(64, 64)" opacity="0.3">
        <circle cx="0" cy="0" r="45" fill="none" stroke="#ffffff" stroke-width="1"/>
        <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="1"/>
        <circle cx="0" cy="0" r="25" fill="none" stroke="#ffffff" stroke-width="1"/>
    </g>
    
    <!-- Smart AI sparkles -->
    <g fill="#ffffff" opacity="0.7">
        <path d="M20 25 L22 20 L24 25 L29 27 L24 29 L22 34 L20 29 L15 27 Z" transform="scale(0.3)"/>
        <path d="M100 35 L102 30 L104 35 L109 37 L104 39 L102 44 L100 39 L95 37 Z" transform="scale(0.3)"/>
        <path d="M105 85 L107 80 L109 85 L114 87 L109 89 L107 94 L105 89 L100 87 Z" transform="scale(0.3)"/>
    </g>
</svg>